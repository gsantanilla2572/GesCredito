# Producción: usa las imágenes publicadas por GitHub Actions en GHCR.
# En el servidor:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Variables (.env en el servidor): GHCR_OWNER, SA_PASSWORD, IMAGE_TAG (opcional, por defecto latest)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express          # cambie a Standard/Enterprise si cuenta con licencia
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?defina SA_PASSWORD}
    volumes: [sqldata:/var/opt/mssql]
    # No se publica el puerto 1433: solo la red interna de Docker accede a la base de datos.
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver: { condition: service_healthy }
    volumes: [./scripts:/scripts:ro]
    # Script idempotente: crea BD/tablas si no existen. Para producción real, elimine los datos de prueba del script.
    command: /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P ${SA_PASSWORD} -i /scripts/01_CreateDatabase.sql
    restart: "no"

  api:
    image: ghcr.io/${GHCR_OWNER:?defina GHCR_OWNER}/gescredito-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GesCredito: "Server=sqlserver,1433;Database=GesCreditoDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"

  web:
    image: ghcr.io/${GHCR_OWNER}/gescredito-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80"]     # Ponga delante Caddy/Traefik/Cloudflare para HTTPS (ver guía)

volumes:
  sqldata:
